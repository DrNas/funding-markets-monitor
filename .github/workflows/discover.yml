name: Discover series (one-off)
on:
  push:
    branches: [claude/discover]
permissions:
  contents: write
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node meta/check4.mjs
      - run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add meta/check4.txt && git commit -m "Discovery metadata" && git push
